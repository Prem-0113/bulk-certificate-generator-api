[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator"
version = "0.1.0"
description = "Bulk Certificate Generator API built with Django, DRF, and Celery"
requires-python = ">=3.11"
dependencies = [
  "Django==5.1.3",
  "djangorestframework==3.15.2",
  "celery==5.4.0",
  "redis==5.0.8",
  "Pillow==10.4.0",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-django==4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "certificates_project.settings"
pythonpath = ["."]
